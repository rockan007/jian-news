name: Build Android APK

on:
  push:
    branches: [ main ]  # 或者您的主分支名称，如master
  pull_request:
    branches: [ main ]  # 或者您的主分支名称
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: |
          cd mobile
          flutter pub get
          
      - name: Check plugin compatibility
        run: |
          cd mobile
          flutter pub deps
          flutter doctor -v
      
      - name: Create .env file
        run: |
          cd mobile
          echo "API_BASE_URL=https://jian-server.lostbug.com/api" > .env
      
      - name: Build APK
        run: |
          cd mobile
          flutter clean
          flutter pub get
          flutter build apk --debug --verbose
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jian-news-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error