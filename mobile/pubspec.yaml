name: jian_news
description: A news application built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  http: ^0.13.5
  provider: ^6.0.5
  cached_network_image: ^3.2.3
  intl: ^0.18.0
  share_plus: ^6.3.1
  url_launcher: ^6.1.10
  flutter_dotenv: ^5.0.2
  connectivity_plus: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/ 