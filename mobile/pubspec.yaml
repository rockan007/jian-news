name: jian_news
description: A news application built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  http: ^1.1.0
  provider: ^6.0.5
  cached_network_image: ^3.2.3
  intl: ^0.18.1
  share_plus: ^7.0.2
  url_launcher: ^6.1.14
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/ 